<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Restaurante</title>
<style>
body{font-family:Arial;margin:20px}
.card{border:1px solid #ccc;padding:10px;margin:10px;display:inline-block;width:220px;vertical-align:top}
img{width:100%;height:140px;object-fit:cover}
</style>
</head>
<body>
<h1>Platos</h1>
<div id="lista"></div>
<script>
fetch('/api/platos').then(r=>r.json()).then(data=>{
  const div=document.getElementById('lista');
  data.forEach(p=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/220x140?text=Sin+imagen'"><h3>${p.nombre}</h3><p>${p.descripcion}</p><p>$${p.precio} - ${p.calorias} kcal</p>`;
    div.appendChild(c);
  });
});
</script>
</body>
</html>
